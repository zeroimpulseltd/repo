name: Public PHP and Vue dependency bundle
on:
  push:
    branches: [build/php-vue-dependencies]
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Prepare public dependencies in Debian
        shell: bash
        run: |
          mkdir -p out
          cat > out/build.sh <<'SCRIPT'
          set -eux
          export DEBIAN_FRONTEND=noninteractive
          rm -f /etc/apt/apt.conf.d/docker-clean
          apt-get update
          packages='php8.4-cli php8.4-mysql php8.4-sqlite3 php8.4-mbstring php8.4-xml php8.4-curl php8.4-zip php8.4-gd mariadb-server mariadb-client apache2 libapache2-mod-php8.4 composer unzip ca-certificates'
          apt-get -y --no-install-recommends --download-only install $packages
          mkdir -p /out/native-debs
          cp /var/cache/apt/archives/*.deb /out/native-debs/
          cd /out
          tar czf native-test-runtime-debs.tar.gz native-debs
          apt-get -y --no-install-recommends install $packages nodejs npm git
          mkdir -p /out/dependencies/php /out/dependencies/node
          cat > /out/dependencies/php/composer.json <<'JSON'
          {"name":"build/php-runtime","type":"project","require":{"php":"^8.3","laravel/framework":"13.29.1","inertiajs/inertia-laravel":"^3.3.4"},"config":{"platform":{"php":"8.3.0"},"allow-plugins":false,"sort-packages":true},"minimum-stability":"stable","prefer-stable":true}
          JSON
          cd /out/dependencies/php
          COMPOSER_ALLOW_SUPERUSER=1 composer install --no-dev --prefer-dist --no-scripts --no-interaction --optimize-autoloader
          composer show --format=json > dependency-versions.json
          composer audit --no-dev --format=json > audit.json || { cat audit.json; exit 1; }
          cat > /out/dependencies/node/package.json <<'JSON'
          {"name":"public-web-build-dependencies","private":true,"type":"module","dependencies":{"vue":"^3.5.0","@inertiajs/vue3":"^3.0.0","react":"18.3.1","react-dom":"18.3.1","react-router-dom":"^6.30.1","lucide-react":"0.439.0","lucide-vue-next":"0.439.0"},"devDependencies":{"vite":"^7.0.0","@vitejs/plugin-vue":"^6.0.0","@vitejs/plugin-react":"^5.0.0","typescript":"^5.9.0","vue-tsc":"^3.0.0","laravel-vite-plugin":"^2.0.0","@babel/core":"^7.28.0","@babel/plugin-transform-react-jsx":"^7.27.1","@babel/parser":"^7.28.0","@babel/traverse":"^7.28.0","@babel/generator":"^7.28.0"}}
          JSON
          cd /out/dependencies/node
          npm install --ignore-scripts --no-fund --no-audit
          npm audit --omit=dev --json > audit.json || { cat audit.json; exit 1; }
          node --version > /out/node-version.txt
          php --version > /out/php-version.txt
          cd /out
          tar czf public-web-dependencies.tar.gz dependencies
          sha256sum public-web-dependencies.tar.gz native-test-runtime-debs.tar.gz > SHA256SUMS
          SCRIPT
          docker run --rm -v "$PWD/out:/out" debian:trixie-slim bash /out/build.sh
      - name: Upload runtime dependencies
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-web-dependencies
          path: out/public-web-dependencies.tar.gz
          retention-days: 1
          if-no-files-found: warn
          compression-level: 0
      - name: Upload isolated database and PHP tools
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-test-runtime
          path: out/native-test-runtime-debs.tar.gz
          retention-days: 1
          if-no-files-found: warn
          compression-level: 0
      - name: Upload verification metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-verification
          path: |
            out/SHA256SUMS
            out/*-version.txt
            out/dependencies/php/composer.json
            out/dependencies/php/composer.lock
            out/dependencies/php/audit.json
            out/dependencies/node/package.json
            out/dependencies/node/package-lock.json
            out/dependencies/node/audit.json
          retention-days: 1
