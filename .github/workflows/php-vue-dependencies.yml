name: Exact Mviringo PHP dependency bundle
on:
  push:
    branches: [build/php-vue-dependencies]
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Build exact public PHP dependencies
        shell: bash
        run: |
          set -eux
          mkdir -p out/php
          cd out/php
          cat > composer.json <<'JSON'
          {"name":"build/mviringo-runtime","type":"project","require":{"php":"^8.3","laravel/framework":"13.29.0","inertiajs/inertia-laravel":"2.0.27"},"config":{"platform":{"php":"8.3.0"},"allow-plugins":false,"sort-packages":true},"minimum-stability":"stable","prefer-stable":true}
          JSON
          composer install --no-dev --prefer-dist --no-scripts --no-interaction --optimize-autoloader
          composer show --format=json > dependency-versions.json
          composer audit --no-dev --format=json > audit.json || true
          php -r "require 'vendor/autoload.php'; echo Composer\\InstalledVersions::getPrettyVersion('laravel/framework'), PHP_EOL; echo Composer\\InstalledVersions::getPrettyVersion('inertiajs/inertia-laravel'), PHP_EOL;" > versions.txt
          cd ..
          tar czf mviringo-php-runtime-laravel-13.29.0.tar.gz php
          sha256sum mviringo-php-runtime-laravel-13.29.0.tar.gz > SHA256SUMS
          php -r '$a=json_decode(file_get_contents("php/audit.json"),true); $n=count($a["advisories"]??[]); if($n){fwrite(STDERR,"Composer audit advisories: $n\n"); exit(1);}'
      - name: Upload exact runtime
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mviringo-php-runtime-13-29
          path: out/mviringo-php-runtime-laravel-13.29.0.tar.gz
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
      - name: Upload verification metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mviringo-php-runtime-13-29-verification
          path: |
            out/SHA256SUMS
            out/php/composer.json
            out/php/composer.lock
            out/php/dependency-versions.json
            out/php/audit.json
            out/php/versions.txt
          retention-days: 1
