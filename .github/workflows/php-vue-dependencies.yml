name: Public frontend dependency bundle
on:
  push:
    branches: [build/php-vue-dependencies]
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Prepare public frontend dependencies
        shell: bash
        run: |
          mkdir -p out/dependencies/node
          cd out/dependencies/node
          cat > package.json <<'JSON'
          {"name":"public-web-build-dependencies","private":true,"type":"module","dependencies":{"vue":"^3.5.0","vue-router":"^4.5.0","@inertiajs/vue3":"^2.0.0","react":"18.3.1","react-dom":"18.3.1","react-router-dom":"^6.30.2","lucide-react":"0.439.0","lucide-vue-next":"0.439.0"},"devDependencies":{"vite":"^6.1.0","@vitejs/plugin-vue":"^5.2.0","@vitejs/plugin-react":"^4.3.0","typescript":"^5.8.0","vue-tsc":"^2.2.0","laravel-vite-plugin":"^1.2.0","@babel/core":"^7.27.0","@babel/plugin-transform-react-jsx":"^7.27.1","@babel/parser":"^7.27.0","@babel/traverse":"^7.27.0","@babel/generator":"^7.27.0","@vue/babel-plugin-jsx":"^1.4.0"}}
          JSON
          npm install --ignore-scripts --no-fund --no-audit
          npm audit --omit=dev --json > audit.json || true
          node --version > node-version.txt
          cd ../..
          tar czf node-dependencies.tar.gz dependencies/node
          sha256sum node-dependencies.tar.gz > SHA256SUMS
          node -e "const a=JSON.parse(require('fs').readFileSync('dependencies/node/audit.json'));if(a.error || (a.metadata?.vulnerabilities?.high||0)+(a.metadata?.vulnerabilities?.critical||0)>0) process.exit(1)"
      - name: Upload dependencies for local verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: node-dependencies
          path: out/node-dependencies.tar.gz
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
      - name: Upload verification metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: node-dependency-verification
          path: |
            out/SHA256SUMS
            out/dependencies/node/package.json
            out/dependencies/node/package-lock.json
            out/dependencies/node/audit.json
            out/dependencies/node/node-version.txt
          retention-days: 1
